<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      RT-H2 (in-repo facet): Content-Security-Policy via meta http-equiv.
      The frontend is a static SPA served from a GCS bucket, and GCS object
      metadata cannot deliver response security headers — so the headers below
      ride along inside the HTML instead.

      Vite builds emit a single hashed entry script and CSS, no inline event
      handlers — so 'script-src self' (no 'unsafe-inline') holds. connect-src
      below carries the prod API origin (api.ownmyhealth.io) as the default;
      the csp-connect-src plugin in vite.config.ts rewrites it to 'self' plus
      the origin derived from VITE_API_URL for the active mode (e.g.
      api-staging.ownmyhealth.io for `--mode staging`). The plugin runs for
      builds AND the dev server, so a local .env with an absolute
      VITE_API_URL (e.g. http://localhost:3001/api/v1) gets its origin
      allowed in dev too. Only when VITE_API_URL is unset or relative is the
      tag left as-is. If a CDN/LB edge policy is added it should supersede
      this meta.

      img-src/style-src include 'unsafe-inline' for the inline styles Tailwind/
      Vite can emit; data: covers the inline SVG favicon and any data-URI images.

      INFRA REMAINDER (cannot be set here — must be set at the serving edge,
      i.e. Cloud CDN / load balancer or a serving proxy in front of the bucket):
        - X-Frame-Options / CSP frame-ancestors  (clickjacking; meta-delivered
          frame-ancestors is ignored by browsers — must be a real header)
        - Strict-Transport-Security (HSTS)        (HTTPS pinning; header-only)
        - X-Content-Type-Options: nosniff         (MIME sniffing; header-only)
      GCS object metadata can't deliver these, so they are tracked as the
      documented edge-config remainder for RT-H2. The exact provisioning steps
      live in the "Provision frontend edge security headers" RUNBOOK playbook.

      INTERIM (M16/L14): clickjacking is mitigated in-app by the frame-bust in
      src/utils/frameGuard.ts (the app refuses to mount inside a frame), so the
      missing real frame-ancestors/X-Frame-Options header is defense-in-depth
      rather than the sole control until the edge layer ships. HSTS and nosniff
      remain genuinely edge-only and are NOT yet enforced.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; connect-src 'self' https://api.ownmyhealth.io; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>OwnMyHealth — Take Control of Your Health Data</title>
    <meta name="description" content="Track biomarkers, analyze trends, parse lab reports, and understand insurance coverage. HIPAA-compliant, encrypted, and private." />
    <meta property="og:title" content="OwnMyHealth — Take Control of Your Health Data" />
    <meta property="og:description" content="Track biomarkers, analyze trends, parse lab reports, and understand insurance coverage." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ownmyhealth.io" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="OwnMyHealth" />
    <meta name="twitter:description" content="Track biomarkers, analyze trends, parse lab reports, and understand insurance coverage. HIPAA-compliant and encrypted." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
