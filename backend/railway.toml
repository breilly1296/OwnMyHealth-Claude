# Railway configuration for OwnMyHealth Backend
# Documentation: https://docs.railway.app/reference/config-as-code

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Railway (a legacy/alternate target) overrides the Dockerfile CMD, so it keeps
# boot-migrate here ON PURPOSE: Railway has no deploy-pipeline job step like
# Cloud Run's ownmyhealth-migrate (.github/workflows/deploy.yml). On Cloud Run
# the image CMD is `node dist/app.js` only and migrations run as a job; the two
# targets intentionally diverge. If Railway is retired, delete this file.
startCommand = "npx prisma migrate deploy && node dist/app.js"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
