name: Deploy to Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

# Least-privilege default GITHUB_TOKEN scope. Like deploy.yml, these jobs only
# checkout and authenticate to GCP via a JSON SA key (secrets.GCP_SA_KEY), not
# GitHub OIDC, so no `id-token: write` is needed; nothing writes back to GitHub.
# (Infra: switch to Workload Identity Federation, then add `id-token: write`.)
permissions:
  contents: read

# Staging mirrors deploy.yml but targets a separate Cloud Run service and GCS
# bucket in the same GCP project. No traffic-splitting, no smoke-test gate —
# staging is the smoke test. Keep the structure duplicated (not a reusable
# workflow) while this is still young; factor once the two jobs drift enough
# to make copy-paste painful.
#
# MIGRATIONS (teardown finding #18): backend/Dockerfile no longer runs
# `prisma migrate deploy` at container boot — prod runs migrations as a
# Cloud Run job step in deploy.yml before staging the new revision. This
# workflow has NO migration step yet, deliberately: as of 2026-06-12 the
# ownmyhealth-backend-staging service, a staging Cloud SQL instance, and a
# staging DATABASE_URL secret do not exist in ownmyhealth-prod (verified via
# gcloud), so there is nothing to point a migrate job at and no live staging
# environment loses boot-migrate behavior. When staging infra is provisioned,
# copy deploy.yml's "Run database migrations" step here with staging's own
# job name / Cloud SQL instance / secret — without it the staging database
# will never receive migrations.

env:
  PROJECT_ID: ownmyhealth-prod
  REGION: us-central1
  SERVICE: ownmyhealth-backend-staging
  REPOSITORY: ownmyhealth
  FRONTEND_BUCKET: ownmyhealth-frontend-staging

jobs:
  # Gate the staging deploy on the same reusable CI (lint / typecheck / tests /
  # audit / secret-scan / live-PG RLS) that deploy.yml runs before prod, so a
  # commit that fails CI is never built or shipped to staging. ci.yml exposes
  # `workflow_call`.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-and-deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Google Auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        # M-15: dropped the mutable `:latest` tag so staging matches prod's
        # SHA-only image addressing (see deploy.yml F-32). The deploy step below
        # references `:${{ github.sha }}`, so `:latest` was unused and only
        # risked a hand-rolled invocation pulling a stale image.
        run: |
          IMAGE_BASE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}"
          IMAGE_SHA="${IMAGE_BASE}:${{ github.sha }}"
          echo "Building $IMAGE_SHA"
          cd backend
          docker build -t "$IMAGE_SHA" .
          docker push "$IMAGE_SHA"

      # Staging deploys straight to 100% traffic — no canary tag, no
      # gated promote step. If this breaks, it breaks staging only.
      - name: Deploy to Cloud Run (staging)
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}"
          echo "Deploying $IMAGE to $SERVICE at 100% traffic"
          # --max-instances=3 bounds in-memory rate-limiter dilution.
          # See backend/src/middleware/rateLimiter.ts.
          gcloud run deploy ${{ env.SERVICE }} \
            --image "$IMAGE" \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT_ID }}" \
            --platform managed \
            --max-instances=3

      - name: Post-deploy health probe
        run: |
          for i in 1 2 3 4 5 6; do
            STATUS=$(curl -sS -o /tmp/body.json -w "%{http_code}" --max-time 30 \
              https://api-staging.ownmyhealth.io/api/v1/health || echo "000")
            echo "  attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "PASS"
              exit 0
            fi
            sleep $((i * 5))
          done
          echo "WARN: staging health probe never returned 200. The revision is live; investigate if retries persist."
          # Non-fatal — staging has no traffic-split safety net to roll back to.

  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Google Auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22' # M15: Node 20 EOL → 22 (match ci.yml NODE_VERSION + Dockerfile)
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # --mode staging makes Vite load .env.staging, which points VITE_API_URL
      # at the staging backend domain.
      - name: Build frontend (staging)
        run: npm run build -- --mode staging

      - name: Deploy to Cloud Storage
        # M-15: replaced `gsutil rm -r` + `cp -r` with `rsync -d -r` to match
        # prod (deploy.yml F-31). The old rm-then-cp shape opened a 404 window
        # where the SPA's assets were missing; rsync uploads new/changed files
        # first, then deletes destination-only objects — no missing-asset gap.
        run: |
          gsutil -m rsync -d -r dist/ gs://${{ env.FRONTEND_BUCKET }}/
          gsutil setmeta -h "Cache-Control:no-cache, no-store, must-revalidate" gs://${{ env.FRONTEND_BUCKET }}/index.html
