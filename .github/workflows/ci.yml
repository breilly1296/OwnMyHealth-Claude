name: CI

on:
  workflow_call:
  push:
    branches: [main, master, develop, 'claude/**']
  pull_request:
    branches: [main, master, develop]

# Least-privilege default GITHUB_TOKEN scope. Every job here only reads the repo
# (checkout) and uploads build artifacts (artifact API — needs no extra token
# scope). Narrowing this from the repo/org default closes off write access to
# issues, PRs, packages, deployments, etc. for the token in CI runs.
permissions:
  contents: read

env:
  NODE_VERSION: '20'

jobs:
  # Frontend Tests and Build
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://ownmyhealth.io/api/v1

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  # Backend Tests and Build
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Generate Prisma client
        run: npx prisma generate --schema=prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/test

      # Runs the full colocated unit suite (controllers, services, middleware,
      # routes, utils — incl. security regression tests). Excludes only
      # services/rls.test.ts, which needs a live Postgres and runs in the `rls`
      # job below. Previously this step ran `test:unit` against a nonexistent
      # dir with --passWithNoTests, so none of these tests gated merges.
      - name: Run unit tests
        run: npm run test:ci

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-dist
          path: backend/dist/
          retention-days: 7

  # Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Fail if a real secret (API key, PEM, hex PHI key, SG./sk-ant- token)
      # is committed to any tracked file. The .env*.example templates carry
      # placeholders and are allowlisted in .gitleaks.toml. Scans the current
      # tree (--no-git) so the gate is deterministic and not tripped by history.
      - name: Secret scan (gitleaks)
        run: |
          GL_VERSION=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --no-git --source . --config .gitleaks.toml --redact --verbose

      # M-17: lowered the audit gate from --audit-level=high to =moderate so
      # moderate-severity advisories (e.g. ReDoS, prototype-pollution in deps
      # handling PHI) block a merge instead of slipping through. Not running
      # `npm audit fix --force` — that can pull in breaking major bumps; fixes
      # go through reviewed dependency PRs.
      - name: Audit frontend dependencies
        run: npm audit --audit-level=moderate

      - name: Audit backend dependencies
        run: npm audit --audit-level=moderate
        working-directory: backend

      # Fail the build if any controller/service bypasses RLS by calling the
      # module-level Prisma client instead of the tx inside a withRLSContext
      # callback. See backend/src/services/database.ts header for details.
      - name: RLS wrapper guard
        run: bash scripts/check-rls-wrappers.sh

  # RLS regression — runs the tenant-isolation + provider-consent suite against
  # a REAL Postgres connected as a NOBYPASSRLS role, so Row-Level Security
  # policies are actually enforced (dev/staging connect as a BYPASSRLS
  # superuser, which silently disables RLS and lets policy regressions ship).
  rls:
    name: RLS Regression (NOBYPASSRLS)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: omh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d omh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      # Migrations run as the superuser — it must own the tables so the separate
      # NOBYPASSRLS app role actually has RLS enforced against it.
      SUPERUSER_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/omh
      # Tests connect as the NOBYPASSRLS role.
      DATABASE_URL: postgresql://omh_app:test@localhost:5432/omh
      # Test-only key (never used to encrypt real PHI). The RLS suite inserts
      # literal placeholder ciphertext and never decrypts, but config/encryption
      # init requires a valid 64-hex key to be present.
      PHI_ENCRYPTION_KEY: '00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff'

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Apply migrations (as superuser)
        run: npx prisma migrate deploy --schema=prisma/schema.prisma
        env:
          DATABASE_URL: ${{ env.SUPERUSER_DATABASE_URL }}

      - name: Provision NOBYPASSRLS test role
        run: psql "$SUPERUSER_DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/rls-test-role.sql

      - name: Run RLS regression suite (as omh_app, RLS enforced)
        run: npm run test:rls

  # TODO: Add E2E test job once staging DB is available in CI.
  # The Playwright specs under /e2e/*.spec.ts exercise the full auth +
  # biomarker + health-guide + export + settings flows against a running
  # dev stack. They need a Postgres instance, seeded test user
  # (e2e/setup/seed-test-user.ts), and both dev servers running concurrently.
  # Defer this to the staging infra rollout (see docs/STAGING.md).
  #
  # e2e-tests:
  #   needs: [backend, frontend]
  #   runs-on: ubuntu-latest
  #   services:
  #     postgres:
  #       image: postgres:15
  #       env:
  #         POSTGRES_PASSWORD: postgres
  #       ports: ['5432:5432']
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with: { node-version: '20', cache: 'npm' }
  #     - run: npm ci
  #     - run: cd backend && npm ci && npx prisma migrate deploy
  #     - run: npm run test:e2e:install
  #     - run: npm run test:e2e
