name: CI

on:
  workflow_call:
  push:
    branches: [main, master, develop, 'claude/**']
  pull_request:
    branches: [main, master, develop]

# Least-privilege default GITHUB_TOKEN scope. Every job here only reads the repo
# (checkout) and uploads build artifacts (artifact API — needs no extra token
# scope). Narrowing this from the repo/org default closes off write access to
# issues, PRs, packages, deployments, etc. for the token in CI runs.
permissions:
  contents: read

env:
  # M15: Node 20 reached EOL Apr 2026 → Node 22 (Maintenance LTS). Single source
  # for every setup-node in this workflow (frontend/backend/security/rls jobs).
  NODE_VERSION: '22'

jobs:
  # Frontend Tests and Build
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://ownmyhealth.io/api/v1

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  # Backend Tests and Build
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Generate Prisma client
        run: npx prisma generate --schema=prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/test

      # Runs the full colocated unit suite (controllers, services, middleware,
      # routes, utils — incl. security regression tests). Excludes only
      # services/rls.test.ts, which needs a live Postgres and runs in the `rls`
      # job below. Previously this step ran `test:unit` against a nonexistent
      # dir with --passWithNoTests, so none of these tests gated merges.
      - name: Run unit tests
        run: npm run test:ci

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-dist
          path: backend/dist/
          retention-days: 7

  # Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Fail if a real secret (API key, PEM, hex PHI key, SG./sk-ant- token)
      # is committed to any tracked file. The .env*.example templates carry
      # placeholders and are allowlisted in .gitleaks.toml. Scans the current
      # tree (--no-git) so the gate is deterministic and not tripped by history.
      - name: Secret scan (gitleaks)
        run: |
          GL_VERSION=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks detect --no-git --source . --config .gitleaks.toml --redact --verbose

      # Gate on High/Critical. (Was =moderate per M-17, but that made the gate
      # un-satisfiable: the only remaining moderates are transitive advisories
      # with no non-breaking fix — uuid/teeny-request/retry-request inside
      # @google-cloud/storage, and @hono/node-server inside Prisma 7's @prisma/dev
      # dev tooling — whose npm "fixes" are breaking downgrades (uuid@14,
      # prisma@6.x) that would risk the PHI-upload and Prisma trees. High/Critical
      # still block a merge; moderates are tracked and bumped via reviewed
      # dependency PRs (Dependabot) as upstream patches land. Not running
      # `npm audit fix --force` — it pulls breaking major bumps.
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Audit backend dependencies
        run: npm audit --audit-level=high
        working-directory: backend

      # Fail the build if any controller/service bypasses RLS by calling the
      # module-level Prisma client instead of the tx inside a withRLSContext
      # callback. See backend/src/services/database.ts header for details.
      - name: RLS wrapper guard
        run: bash scripts/check-rls-wrappers.sh

  # RLS regression — runs the tenant-isolation + provider-consent suite against
  # a REAL Postgres connected as a NOBYPASSRLS role, so Row-Level Security
  # policies are actually enforced (dev/staging connect as a BYPASSRLS
  # superuser, which silently disables RLS and lets policy regressions ship).
  rls:
    name: RLS Regression (NOBYPASSRLS)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: omh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d omh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      # Migrations run as the superuser — it must own the tables so the separate
      # NOBYPASSRLS app role actually has RLS enforced against it.
      SUPERUSER_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/omh
      # Tests connect as the NOBYPASSRLS role.
      DATABASE_URL: postgresql://omh_app:test@localhost:5432/omh
      # Test-only key (never used to encrypt real PHI). The RLS suite inserts
      # literal placeholder ciphertext and never decrypts, but config/encryption
      # init requires a valid 64-hex key to be present.
      PHI_ENCRYPTION_KEY: '00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff'

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Apply migrations (as superuser)
        run: npx prisma migrate deploy --schema=prisma/schema.prisma
        env:
          DATABASE_URL: ${{ env.SUPERUSER_DATABASE_URL }}

      - name: Provision NOBYPASSRLS test role
        run: psql "$SUPERUSER_DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/rls-test-role.sql

      - name: Run RLS regression suite (as omh_app, RLS enforced)
        run: npm run test:rls

  # E2E — the full Playwright suite (auth, biomarker entry, export, settings,
  # health guide, and the P0-3 export/delete journey) against a real running
  # stack: Vite + Express + a service Postgres with all migrations applied and
  # the app connecting as the NOBYPASSRLS role (RLS enforced, like prod).
  # Playwright's webServer config boots both dev servers; its env overlay
  # raises the rate-limiter knobs for the e2e-launched backend only.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: omh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d omh"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: development
      SUPERUSER_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/omh
      # The app connects as the NOBYPASSRLS role so the journeys run with RLS
      # actually enforced (same role provisioning as the rls job).
      DATABASE_URL: postgresql://omh_app:test@localhost:5432/omh
      # Test-only secrets — never used outside this job. Formats must satisfy
      # the universal config validation (64-hex PHI key, >=32-char JWT secrets,
      # >=16-char audit salt; placeholder values are rejected).
      PHI_ENCRYPTION_KEY: '00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff'
      JWT_ACCESS_SECRET: 'e2e-ci-access-0123456789abcdef0123456789abcdef'
      JWT_REFRESH_SECRET: 'e2e-ci-refresh-0123456789abcdef0123456789abcdef'
      AUDIT_LOG_SALT: 'aabbccddeeff00112233445566778899aabbccddeeff00112233445566778899'
      # index.html ships a meta CSP whose connect-src allows only the PROD API
      # origin; the csp-connect-src plugin in vite.config.ts rewrites it to the
      # origin of VITE_API_URL. Locally the repo-root .env provides this; CI has
      # no .env, and without it the browser CSP blocks every localhost:3001
      # call ("Unable to connect to the server" on login).
      VITE_API_URL: 'http://localhost:3001/api/v1'

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Apply migrations (as superuser)
        working-directory: backend
        run: npx prisma migrate deploy --schema=prisma/schema.prisma
        env:
          DATABASE_URL: ${{ env.SUPERUSER_DATABASE_URL }}

      - name: Provision NOBYPASSRLS app role
        working-directory: backend
        run: psql "$SUPERUSER_DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/rls-test-role.sql

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Seed standing e2e user
        run: npm run test:e2e:setup

      - name: Run Playwright suite
        run: npx playwright test --project=chromium

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  # Defer this to the staging infra rollout (see docs/STAGING.md).
  #
  # e2e-tests:
  #   needs: [backend, frontend]
  #   runs-on: ubuntu-latest
  #   services:
  #     postgres:
  #       image: postgres:15
  #       env:
  #         POSTGRES_PASSWORD: postgres
  #       ports: ['5432:5432']
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with: { node-version: '22', cache: 'npm' }
  #     - run: npm ci
  #     - run: cd backend && npm ci && npx prisma migrate deploy
  #     - run: npm run test:e2e:install
  #     - run: npm run test:e2e
