name: Secret history scan

# OMH-M01: the CI "Secret scan" job runs gitleaks with --no-git (working tree
# only), so a secret that was committed and later removed from HEAD — e.g. the
# OMH-C01 production service-account key in commit 202f2dd — is invisible to it.
# This job scans the FULL git history so historical leaks surface for rotation
# and purge. It runs nightly + on demand so it NEVER blocks PR merges; it will
# (correctly) fail until any historical secret is rotated AND purged from history.
on:
  schedule:
    - cron: '17 7 * * *' # daily 07:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history-scan:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: gitleaks (full history)
        run: |
          GL_VERSION=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          # No --no-git: scans every commit in history (the .gitleaks.toml
          # allowlist still applies to the *.example placeholder templates).
          ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose
