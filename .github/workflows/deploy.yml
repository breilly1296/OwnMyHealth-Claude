name: Deploy to Cloud Run

# F-30 — every third-party action below is pinned to a full commit SHA (with a
# trailing `# vN.N.N` comment naming the release) instead of a mutable major-version
# tag. A version tag can be force-pushed to a malicious commit; a SHA pin makes the
# action body tamper-evident. Renovate / Dependabot can still bump these with a
# reviewable diff. SHAs resolved 2026-06-01 against GitHub's published tag refs:
#   actions/checkout                 34e114876b0b11c390a56381ad16ebd13914f8d5  v4.3.1
#   actions/setup-node               49933ea5288caeca8642d1e84afbd3f7d6820020  v4.4.0
#   google-github-actions/auth       c200f3691d83b41bf9bbd8638997a462592937ed  v2.1.13
#   google-github-actions/setup-gcloud e427ad8a34f8676edf47cf7d7925499adf3eb74f v2.2.1

on:
  push:
    branches: [master, main]
  workflow_dispatch:

# Least-privilege default GITHUB_TOKEN scope. These jobs only checkout the repo
# and authenticate to GCP via google-github-actions/auth using a JSON SA key
# (secrets.GCP_SA_KEY) — not GitHub OIDC — so no `id-token: write` is required.
# Nothing here writes back to GitHub (no releases, PR comments, package pushes).
# NOTE (infra): migrating to Workload Identity Federation would replace the
# long-lived SA key with short-lived OIDC tokens, at which point add
# `id-token: write` here.
permissions:
  contents: read

env:
  PROJECT_ID: ownmyhealth-prod
  REGION: us-central1
  SERVICE: ownmyhealth-backend
  REPOSITORY: ownmyhealth
  FRONTEND_BUCKET: ownmyhealth-frontend
  MIGRATE_JOB: ownmyhealth-migrate
  # Same Cloud SQL instance the service itself is wired to
  # (run.googleapis.com/cloudsql-instances annotation on ownmyhealth-backend).
  CLOUDSQL_INSTANCE: ownmyhealth-prod:us-central1:ownmyhealth-db

jobs:
  # Gate the ENTIRE deploy on the full CI suite before anything is built or
  # shipped: frontend lint+test+build, backend lint+test:ci+build, gitleaks
  # secret scan, High/Critical dependency audit, the RLS-wrapper guard, and the
  # NOBYPASSRLS tenant-isolation suite against a real Postgres. Without this, a
  # master commit that breaks RLS / CSRF / refresh-token reuse detection / PHI
  # encryption would still build and ship to the HIPAA production service on a
  # green /health curl. ci.yml already exposes `workflow_call`, so we invoke it
  # as a reusable workflow instead of duplicating its jobs.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # Build the image and deploy to Cloud Run at 0% traffic with a tagged URL.
  # If this job fails, nothing has shifted in production. Gated on `ci`: a commit
  # that fails lint / tests / audit / secret-scan / RLS is never built or staged.
  build-and-stage:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      new_revision: ${{ steps.deploy.outputs.new_revision }}
      staging_url: ${{ steps.deploy.outputs.staging_url }}
      staging_tag: ${{ steps.deploy.outputs.staging_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Google Auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        # F-32: dropped the `:latest` tag. Cloud Run deploys reference
        # `:${{ github.sha }}` (see "Deploy no-traffic tagged revision" below),
        # so `:latest` was unused dead weight. Removing it eliminates the
        # confusion of two coexisting "current image" pointers and the risk
        # of a future hand-rolled `kubectl`/`gcloud` invocation pulling a
        # stale `:latest` while traffic is on a different SHA.
        run: |
          IMAGE_BASE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}"
          IMAGE_SHA="${IMAGE_BASE}:${{ github.sha }}"
          echo "Building $IMAGE_SHA"
          cd backend
          docker build -t "$IMAGE_SHA" .
          docker push "$IMAGE_SHA"

      - name: Run database migrations
        # Teardown finding #18 (first half): `prisma migrate deploy` used to
        # run in the container CMD, so every cold start paid the ~10s migrate
        # check and a failing migration bricked container boot (the coupling
        # behind the 10-day silent deploy outage resolved 2026-06-12).
        # Migrations now run exactly once per deploy, as a Cloud Run job,
        # AFTER the image push and BEFORE the new revision is staged — so a
        # failed migration fails the DEPLOY, never the running service.
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}"

          # `jobs deploy` creates the job on first run and updates it (new
          # image SHA) on every run after. --max-retries 0: a migration is not
          # safely retryable by a dumb re-run; a human looks at failures.
          gcloud run jobs deploy ${{ env.MIGRATE_JOB }} \
            --image "$IMAGE" \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT_ID }}" \
            --set-cloudsql-instances "${{ env.CLOUDSQL_INSTANCE }}" \
            --set-secrets "DATABASE_URL=DATABASE_URL:latest" \
            --command npx \
            --args prisma,migrate,deploy \
            --max-retries 0 \
            --task-timeout 10m \
            --memory 512Mi

          # Deliberately a separate `execute --wait` rather than folding
          # `--execute-now --wait` into the deploy above: `jobs execute --wait`
          # blocks until the execution finishes and exits NONZERO when it
          # fails — that property is the entire point (a failed migration must
          # fail this workflow step). It also keeps "update job config" and
          # "run the migration" separately diagnosable in the Actions log.
          gcloud run jobs execute ${{ env.MIGRATE_JOB }} \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT_ID }}" \
            --wait

      - name: Deploy no-traffic tagged revision
        id: deploy
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="staging-${SHORT_SHA}"
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}"

          echo "Deploying revision tagged $TAG at 0% traffic"
          # --max-instances=3 bounds in-memory rate-limiter dilution.
          # See rateLimiter.ts for the per-instance-store limitation. Keep in
          # sync with that comment: raising this cap means switching the
          # limiter store to Redis first.
          # RT-H1: NODE_ENV=production is set explicitly here (belt) and baked
          # into the image via ENV in backend/Dockerfile (suspenders). If
          # NODE_ENV is unset the backend would boot at the dev security tier;
          # config/index.ts also hard-fails a clearly-deployed image that isn't
          # production. --update-env-vars (NOT --set-env-vars) is deliberate:
          # it merges this one key and leaves the secrets/env wired on the
          # service out-of-band intact, whereas --set-env-vars replaces the
          # whole set and would wipe them.
          gcloud run deploy ${{ env.SERVICE }} \
            --image "$IMAGE" \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT_ID }}" \
            --platform managed \
            --no-traffic \
            --max-instances=3 \
            --update-env-vars=NODE_ENV=production \
            --tag "$TAG"

          NEW_REV=$(gcloud run services describe ${{ env.SERVICE }} \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT_ID }}" \
            --format='value(status.latestCreatedRevisionName)')

          STAGING_URL=$(gcloud run services describe ${{ env.SERVICE }} \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT_ID }}" \
            --format=json | jq -r --arg tag "$TAG" '.status.traffic[] | select(.tag == $tag) | .url')

          if [ -z "$STAGING_URL" ] || [ "$STAGING_URL" = "null" ]; then
            echo "ERROR: could not resolve staging URL for tag $TAG"
            exit 1
          fi

          echo "new_revision=$NEW_REV"       | tee -a "$GITHUB_OUTPUT"
          echo "staging_url=$STAGING_URL"    | tee -a "$GITHUB_OUTPUT"
          echo "staging_tag=$TAG"            | tee -a "$GITHUB_OUTPUT"

  # Smoke-test the staging revision via its tagged URL. /health exercises
  # Cloud SQL connectivity, which was the failure mode behind the
  # 2026-04-17 incident. Authenticated tests deliberately excluded —
  # they would require test credentials in GitHub secrets.
  smoke-test:
    needs: build-and-stage
    runs-on: ubuntu-latest
    steps:
      - name: Staging health probe
        run: |
          URL="${{ needs.build-and-stage.outputs.staging_url }}/api/v1/health"
          echo "Probing $URL"
          # Retry to absorb cold-start latency (Node boot; migrations now run
          # pre-deploy via the ownmyhealth-migrate Cloud Run job, not at boot).
          for i in 1 2 3 4 5 6; do
            STATUS=$(curl -sS -o /tmp/body.json -w "%{http_code}" --max-time 30 "$URL" || echo "000")
            echo "  attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              BODY=$(cat /tmp/body.json)
              if echo "$BODY" | grep -q '"success":true'; then
                echo "PASS"
                echo "  body: $BODY"
                exit 0
              else
                echo "  200 but body missing success:true — $BODY"
              fi
            fi
            sleep $((i * 5))
          done
          echo "FAIL: staging never returned 200 with success:true"
          exit 1

  # Shift 100% traffic to the new revision. Uses explicit --to-revisions
  # (not --to-latest) so rollback is a deterministic, named-revision op.
  #
  # Tradeoff: this means env-only updates via `gcloud run services update`
  # won't auto-shift traffic on subsequent deploys (they stay pinned to
  # the latest promoted revision). That's intentional — forces every
  # production traffic shift to go through a smoke-tested promotion.
  # See cloud-run-env-update-pinning.md in the local memory notes.
  promote:
    needs: [build-and-stage, smoke-test]
    runs-on: ubuntu-latest
    steps:
      - name: Google Auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Shift 100% traffic to new revision
        run: |
          NEW_REV="${{ needs.build-and-stage.outputs.new_revision }}"
          echo "Promoting $NEW_REV to 100% traffic"
          gcloud run services update-traffic ${{ env.SERVICE }} \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT_ID }}" \
            --to-revisions="$NEW_REV=100"

      - name: Post-promote prod health probe
        run: |
          for i in 1 2 3; do
            STATUS=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 15 https://api.ownmyhealth.io/api/v1/health || echo "000")
            echo "attempt $i: HTTP $STATUS"
            if [ "$STATUS" != "200" ]; then
              echo "FAIL: prod returned $STATUS after traffic shift — consider rolling back"
              exit 1
            fi
          done
          echo "Prod healthy on ${{ needs.build-and-stage.outputs.new_revision }}"

      - name: Remove staging tag
        run: |
          TAG="${{ needs.build-and-stage.outputs.staging_tag }}"
          gcloud run services update-traffic ${{ env.SERVICE }} \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT_ID }}" \
            --remove-tags="$TAG" || true

  # Frontend ships only after CI passes AND the backend has successfully
  # promoted, so the SPA is never published against a backend revision that
  # failed to go live. Previously this job had no `needs` at all and deployed
  # unconditionally, in parallel with (and regardless of) the backend pipeline.
  deploy-frontend:
    needs: [ci, promote]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Google Auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: https://api.ownmyhealth.io/api/v1

      - name: Deploy to Cloud Storage
        # F-31: replaced `gsutil rm -r` + `gsutil cp -r` with `gsutil rsync`.
        # The old shape created a 404 window (between rm and cp completing)
        # during which any user opening the SPA would get the GCS error
        # page. `rsync -d -r` uploads new/changed files first, then deletes
        # objects no longer in `dist/` — no window where assets are missing.
        # `-d` deletes destination-only files; `-r` recurses; `-c` would add
        # checksum-based diffing but Cloud Run + cache bust on `index.html`
        # makes mtime-based diffing fine here.
        run: |
          gsutil -m rsync -d -r dist/ gs://${{ env.FRONTEND_BUCKET }}/
          gsutil setmeta -h "Cache-Control:no-cache, no-store, must-revalidate" gs://${{ env.FRONTEND_BUCKET }}/index.html
