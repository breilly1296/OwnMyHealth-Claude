name: Deploy to Cloud Run

on:
  push:
    branches: [master, main]
  workflow_dispatch:

env:
  PROJECT_ID: ownmyhealth-prod
  REGION: us-central1
  SERVICE: ownmyhealth-backend
  REPOSITORY: ownmyhealth

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Verify Configuration
        run: |
          echo "=== Authenticated as ==="
          gcloud config get-value account
          echo "=== Project ==="
          gcloud config get-value project
          echo "=== Expected ==="
          echo "Account: github-deploy@ownmyhealth-prod.iam.gserviceaccount.com"
          echo "Project: ownmyhealth-prod"

      - name: Build and Push with Cloud Build
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}"
          echo "Building image: $IMAGE"

          # Submit build asynchronously and capture build ID
          BUILD_ID=$(gcloud builds submit backend \
            --tag "$IMAGE" \
            --project "${{ env.PROJECT_ID }}" \
            --async \
            --format='value(id)')

          echo "Build submitted: $BUILD_ID"

          # Poll for build completion
          while true; do
            STATUS=$(gcloud builds describe "$BUILD_ID" \
              --project "${{ env.PROJECT_ID }}" \
              --format='value(status)')

            echo "Build status: $STATUS"

            case "$STATUS" in
              SUCCESS)
                echo "Build completed successfully"
                break
                ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                echo "Build failed with status: $STATUS"
                exit 1
                ;;
              *)
                echo "Build in progress, waiting 15s..."
                sleep 15
                ;;
            esac
          done

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image "${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}" \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT_ID }}" \
            --platform managed
