name: Deploy to Cloud Run

on:
  push:
    branches: [master, main]
  workflow_dispatch:

env:
  PROJECT_ID: ownmyhealth-prod
  REGION: us-central1
  SERVICE: ownmyhealth-backend
  REPOSITORY: ownmyhealth
  FRONTEND_BUCKET: ownmyhealth-frontend

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |
          IMAGE_BASE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}"
          IMAGE_SHA="${IMAGE_BASE}:${{ github.sha }}"
          IMAGE_LATEST="${IMAGE_BASE}:latest"

          echo "=========================================="
          echo "Building Docker image..."
          echo "Image with SHA: $IMAGE_SHA"
          echo "Image latest: $IMAGE_LATEST"
          echo "=========================================="

          # Build the Docker image locally
          cd backend
          docker build -t "$IMAGE_SHA" -t "$IMAGE_LATEST" .

          echo "=========================================="
          echo "Pushing images to Artifact Registry..."
          echo "=========================================="

          # Push both tags
          docker push "$IMAGE_SHA"
          docker push "$IMAGE_LATEST"

          echo "=========================================="
          echo "Images pushed successfully!"
          echo "SHA image: $IMAGE_SHA"
          echo "Latest image: $IMAGE_LATEST"
          echo "=========================================="

      - name: Deploy to Cloud Run
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.SERVICE }}:${{ github.sha }}"
          echo "=========================================="
          echo "Deploying to Cloud Run..."
          echo "Service: ${{ env.SERVICE }}"
          echo "Image: $IMAGE"
          echo "Region: ${{ env.REGION }}"
          echo "=========================================="

          gcloud run deploy ${{ env.SERVICE }} \
            --image "$IMAGE" \
            --region "${{ env.REGION }}" \
            --project "${{ env.PROJECT_ID }}" \
            --platform managed

          echo "=========================================="
          echo "Deployment complete!"
          echo "Service URL: https://$(gcloud run services describe ${{ env.SERVICE }} --region ${{ env.REGION }} --format='value(status.url)' 2>/dev/null || echo 'api.ownmyhealth.io')"
          echo "=========================================="

  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: https://api.ownmyhealth.io/api/v1

      - name: Deploy to Cloud Storage
        run: |
          gsutil -m rm -r gs://${{ env.FRONTEND_BUCKET }}/** || true
          gsutil -m cp -r dist/* gs://${{ env.FRONTEND_BUCKET }}/
          gsutil setmeta -h "Cache-Control:no-cache, no-store, must-revalidate" gs://${{ env.FRONTEND_BUCKET }}/index.html
